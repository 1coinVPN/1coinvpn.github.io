<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1coinVPN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo64.webp">
<!-- JS が無効でも必ず移動する。中国の一部ブラウザ対策 -->
<meta http-equiv="refresh" content="4;url=https://site.jurentp.com/">
<style>
/* ダッシュボード(site.jurentp.com)と同じ配色に揃えている。
   背景=濃紺 #0a0e1a / アクセント=青 #2f6df6。
   ★重い処理(blur・drop-shadow・無限アニメ)は入れない。中国の回線と端末で軽く出すため★ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#0a0e1a;color:#e8ecf4;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* 静的なグラデーション。blur を使わないので描画が軽い */
  background-image:radial-gradient(circle at 50% 44%,#16224a 0%,#0d1226 42%,#0a0e1a 72%);
}
.brand{position:fixed;left:32px;top:26px;display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px;display:block}
.brand span{font-size:15px;font-weight:700;letter-spacing:.04em}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.earth{width:min(58vmin,400px);height:auto;display:block;opacity:.96;
  animation:in .9s ease-out both}
@keyframes in{from{opacity:0;transform:scale(.94)}to{opacity:.96;transform:none}}

.load{position:fixed;left:0;right:0;bottom:13%;text-align:center}
.load p{font-size:11px;font-weight:600;letter-spacing:.44em;color:#8ea0c0;
  text-indent:.44em;margin-bottom:12px}
.bar{width:min(190px,50vw);height:2px;margin:0 auto;border-radius:99px;background:#ffffff1c;overflow:hidden}
.bar b{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#2f6df6,#5b9dff);animation:fill 3.6s linear forwards}
@keyframes fill{to{width:100%}}

.go{position:fixed;left:0;right:0;bottom:5.4%;text-align:center;
  font-size:11.5px;color:#5b6a86;text-decoration:none;letter-spacing:.05em}
.go:hover,.go:focus{color:#8fb4ff}

@media(max-width:520px){.brand{left:20px;top:18px}.earth{width:70vmin}.load{bottom:15%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.earth{opacity:.96}}
</style>
</head>
<body>
<div class="brand"><img src="logo64.webp" width="30" height="30" alt=""><span>1coinVPN</span></div>

<div class="stage"><img class="earth" src="earth.webp" width="400" height="400" alt="1coinVPN" fetchpriority="high"></div>

<div class="load">
  <p>LOADING</p>
  <div class="bar"><b></b></div>
</div>

<a class="go" id="go" href="https://site.jurentp.com/">移動しない場合はこちら</a>

<script>
/* ★移動先はここだけ書き換える。規制でURLが変わったらこの1行のみ直せばよい★ */
var DEST = "https://site.jurentp.com/";
document.getElementById("go").href = DEST;
document.querySelector('meta[http-equiv="refresh"]').content = "4;url=" + DEST;
setTimeout(function () { location.replace(DEST); }, 1600);
</script>
</body>
</html>
